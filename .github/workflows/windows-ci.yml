name: Windows CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  validate:
    name: Validate on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Svelte check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Node tests
        run: npm run test:node

      - name: Component tests
        run: npm run test:component

      - name: Cargo test
        run: npm run cargo:test

      - name: Permission drift check
        shell: pwsh
        run: $drift = git status --porcelain -- src-tauri/permissions; if ($drift) { Write-Host "Build regenerated permission files:"; $drift; git --no-pager diff -- src-tauri/permissions; exit 1 }

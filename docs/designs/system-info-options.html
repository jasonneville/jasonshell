<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>System Info layout choices</title>
<style>
/* JasonShell vitesse-dark palette, from src/app.css. Document exterior stays transparent. */
:root{--js-color-text:#dbd7ca;--js-color-text-strong:#f7f3e8;--js-color-text-muted:#b8b3a7;--js-color-accent:#e2b776;--js-color-accent-soft:rgba(226,183,118,.16);--js-color-border:rgba(226,183,118,.18);--js-color-border-soft:rgba(226,183,118,.1);--js-bg-surface:#242424;--js-color-surface:#1c1c1c;--js-font-sans:'Segoe UI',sans-serif}
html,body{margin:0;background:transparent}*{box-sizing:border-box}.options-root{color:var(--js-color-text);font: .875rem/1.45 var(--js-font-sans);min-width:0}.options-root *{color:inherit}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--js-color-accent);outline-offset:2px}button:disabled{cursor:default;opacity:.7}.choices{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.45rem}.choice{background:var(--js-color-surface);border:1px solid var(--js-color-border);border-radius:5px;padding:.65rem .55rem;text-align:left;min-width:0}.choice[aria-pressed=true]{background:#302a21;border-color:var(--js-color-accent)}.choice b{display:block;font-size:.8rem;color:var(--js-color-text-strong)}.choice small{display:block;font-size:.68rem;color:var(--js-color-text-muted);margin-top:.3rem}.choice .letter{font-size:.65rem;color:var(--js-color-accent);letter-spacing:.08em}.layout-mark{height:29px;display:grid;gap:3px;margin:.4rem 0}.layout-mark i{display:block;background:#61513b;border-radius:1px}.mark-a{grid-template-columns:repeat(3,1fr);grid-template-rows:10px 1fr}.mark-a i:last-child{grid-column:1/-1}.mark-b{grid-template-columns:1.6fr 1fr}.mark-c{grid-template-columns:1fr 3fr}.mark-d{grid-template-rows:repeat(4,1fr)}.mark-e{grid-template-columns:2fr 1fr;grid-template-rows:2fr 1fr}.mark-e i:first-child{grid-row:1/-1}.tools{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap;margin:.65rem 0}.tools p{margin:0;color:var(--js-color-text-muted);font-size:.75rem}.toggle,.submit{border:1px solid var(--js-color-border);border-radius:4px;padding:.45rem .75rem;background:#242424;color:var(--js-color-text)}.toggle[aria-pressed=true]{border-color:var(--js-color-accent)}.preview-label{display:flex;gap:.6rem;justify-content:space-between;align-items:baseline;flex-wrap:wrap;margin:0 0 .35rem}.preview-label h2{margin:0;font-size:.95rem;color:var(--js-color-text-strong)}.preview-label p{font-size:.72rem;color:var(--js-color-text-muted);margin:0}.preview[hidden]{display:none}.preview+.preview{margin-top:1.2rem}.shell{background:var(--js-bg-surface);border:1px solid var(--js-color-border);border-radius:6px;overflow:hidden;box-shadow:inset 0 1px 0 #ffffff0f}.chrome{display:flex;align-items:center;justify-content:space-between;padding:.45rem .65rem;min-height:40px;gap:.5rem}.chrome strong{font-size:.76rem;letter-spacing:.02em;text-transform:uppercase;color:var(--js-color-text-strong)}.chrome .close{font-size:1.2rem;color:var(--js-color-text-muted);line-height:1;text-align:center;width:28px}.tabs{display:flex;gap:.3rem;padding:0 .6rem .4rem;border-bottom:1px solid var(--js-color-border-soft)}.tabs span{font-size:.7rem;padding:.3rem .65rem;color:var(--js-color-text-muted)}.tabs .active{background:var(--js-color-accent-soft);border:1px solid #e2b77655;border-radius:4px;color:var(--js-color-text-strong)}.stage{height:480px;overflow:auto;scrollbar-color:#776044 #242424;scrollbar-gutter:stable;padding:.85rem}.intro{display:flex;gap:.4rem;justify-content:space-between;flex-wrap:wrap;margin-bottom:.7rem}.intro p{margin:0;font-size:.67rem;color:var(--js-color-text-muted)}.intro .fiction{color:var(--js-color-accent)}.section{min-width:0;margin:0 0 1rem}.section h3{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--js-color-accent);margin:0 0 .5rem}.hint{font-size:.66rem;color:var(--js-color-text-muted);margin:.4rem 0}.reading{min-width:0}.reading span{display:block;font-size:.68rem;color:var(--js-color-text-muted)}.reading strong{display:block;color:var(--js-color-text-strong);font-size:1.2rem;font-weight:600;font-variant-numeric:tabular-nums}.reading small{display:block;font-size:.64rem;color:var(--js-color-text-muted)}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem}.facts{margin:0}.fact{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;padding:.3rem 0;border-bottom:1px solid #ffffff08}.fact dt{font-size:.7rem;color:var(--js-color-text-muted)}.fact dd{margin:0;font-size:.73rem;text-align:right;color:var(--js-color-text-strong);overflow-wrap:anywhere;min-width:0}.unavailable{display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap;color:var(--js-color-text-muted);font-size:.72rem}.unavailable b{font-weight:500;color:var(--js-color-text-strong)}.network-title{font-size:.76rem;font-weight:600;margin:0 0 .3rem;color:var(--js-color-text-strong)}.kind{font-size:.62rem;color:var(--js-color-text-muted);font-weight:400;margin-left:.4rem}.meta{border-top:1px solid var(--js-color-border-soft);padding-top:.5rem;font-size:.67rem;color:var(--js-color-text-muted)}.meta summary{cursor:pointer}.meta p{margin:.5rem 0 0;color:var(--js-color-text-muted)}.strip{border-bottom:1px solid var(--js-color-border);padding-bottom:.8rem;margin-bottom:.9rem}.strip .metrics{grid-template-columns:repeat(4,minmax(0,1fr))}.strip .reading:last-child strong{font-size:.95rem;padding-top:.2rem}.a .section:not(.overview){display:grid;grid-template-columns:105px minmax(0,1fr);gap:.8rem;padding:.45rem 0;margin-bottom:.3rem;border-bottom:1px solid #ffffff08}.a .section:not(.overview) h3{padding-top:.3rem}.a .section:not(.overview) .hint{margin-top:.25rem}.a .section:not(.overview) .fact:last-child{border-bottom:0}.split{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:.75rem}.b .section{padding:.75rem;background:var(--js-color-surface);border:1px solid #ffffff0b;border-radius:5px;margin-bottom:.75rem}.b .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.b .reading strong{font-size:1.6rem}.b .reading:last-child{grid-column:1/-1}.b .reading:last-child strong{font-size:.95rem}.b .fact{display:block}.b .fact dd{text-align:left;margin-top:.12rem}.browse{display:grid;grid-template-columns:105px minmax(0,1fr);gap:1rem}.section-nav{position:sticky;top:0;align-self:start;display:grid;gap:.3rem}.section-nav a{padding:.4rem .5rem;text-decoration:none;color:var(--js-color-text-muted);font-size:.72rem;border-left:2px solid transparent}.section-nav a:first-child{border-color:var(--js-color-accent);background:var(--js-color-accent-soft);color:var(--js-color-text-strong)}.section-nav a:hover{color:var(--js-color-text-strong)}.c .section{scroll-margin-top:.4rem;padding:0 0 .75rem;border-bottom:1px solid var(--js-color-border-soft)}.c .overview .reading strong{font-size:1.5rem}.c .overview .reading:last-child{grid-column:1/-1}.c .overview .reading:last-child strong{font-size:1rem}.d .section{margin-bottom:.7rem}.d .section h3{background:#30302e;margin:0;padding:.35rem .5rem;color:var(--js-color-text-strong);font-size:.65rem}.d .metrics{display:block}.d .reading{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding:.35rem .5rem;border-bottom:1px solid #ffffff09;align-items:baseline;gap:0 .7rem}.d .reading strong{font-size:.77rem;text-align:right}.d .reading small{grid-column:1/-1;font-size:.63rem}.d .fact{padding:.35rem .5rem}.d .hint,.d .network-title,.d .unavailable{padding-left:.5rem}.hero-rail{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:1rem}.hero{border-bottom:1px solid var(--js-color-border);padding:.2rem 0 .85rem}.e .overview .metrics{grid-template-columns:1.3fr 1fr}.e .overview .reading:first-child{grid-row:span 2}.e .overview .reading:first-child strong{font-size:3.4rem;line-height:1.2;color:var(--js-color-accent)}.e .overview .reading:not(:first-child) strong{font-size:1.05rem}.e .overview .reading:last-child{grid-column:1/-1;margin-top:.3rem}.hardware-rail{background:var(--js-color-surface);padding:.7rem;border-radius:4px}.hardware-rail .fact{display:block;padding:.45rem 0}.hardware-rail .fact dd{text-align:left;margin-top:.2rem}.submit-row{display:flex;justify-content:space-between;align-items:center;gap:.7rem;flex-wrap:wrap;margin-top:.8rem}.submit-row p{font-size:.75rem;margin:0;color:var(--js-color-text-muted)}.submit{background:#e2b776;color:#211c16;border-color:#e2b776;font-weight:650;min-height:38px}.all .preview{display:block}.previews.all{display:grid;gap:1rem}.all .preview+.preview{margin-top:0}@media(min-width:1250px){.previews.all{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:580px){.choices{grid-template-columns:repeat(2,minmax(0,1fr))}.choice:last-child{grid-column:1/-1}.layout-mark{display:none}.choice small{margin-top:.15rem}.stage{height:450px;padding:.65rem}.split,.hero-rail{grid-template-columns:1fr}.b .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.b .fact{display:flex}.b .fact dd{text-align:right}.strip .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.a .section:not(.overview){grid-template-columns:1fr;gap:0}.browse{grid-template-columns:1fr;gap:.65rem}.section-nav{display:flex;flex-wrap:wrap;position:static;gap:.1rem}.section-nav a{padding:.3rem;font-size:.65rem}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.hardware-rail .fact{display:flex}.hardware-rail .fact dd{text-align:right}.fact{gap:.5rem}.fact dt{max-width:60%}.preview-label{display:block}.e .overview .reading:first-child strong{font-size:3rem}}
</style>
</head>
<body>
<div class="options-root">
  <div class="choices" aria-label="Choose a System Info layout"></div>
  <div class="tools"><p>Fictional readings · layout previews only · production stays unchanged</p><button type="button" class="toggle" aria-pressed="false">Show all five</button></div>
  <div class="previews"></div>
  <div class="submit-row"><p id="selection" role="status" aria-live="polite"></p><button class="submit" type="button">Use this layout</button></div>
</div>
<script>
(()=>{
const designs=[
 {id:'A',name:'Metric strip',summary:'Quick totals, then quiet section rows.',description:'Maximum scan speed; minimal containers.',mark:'<i></i><i></i><i></i><i></i>'},
 {id:'B',name:'Split dashboard',summary:'Live readings left; machine details right.',description:'Two columns separate live activity from inventory.',mark:'<i></i><i></i>'},
 {id:'C',name:'Section browser',summary:'A navigation rail beside a reading pane.',description:'Jump to a section without losing your place.',mark:'<i></i><i></i>'},
 {id:'D',name:'Dense inspector',summary:'Aligned labels and values, little chrome.',description:'Most information per screen; consistent reading rhythm.',mark:'<i></i><i></i><i></i><i></i>'},
 {id:'E',name:'Overview + rail',summary:'CPU-led overview with a hardware sidebar.',description:'A strong overview focal point; stable machine identity beside it.',mark:'<i></i><i></i><i></i>'}
];
const fact=(label,value)=>`<div class="fact"><dt>${label}</dt><dd>${value}</dd></div>`;
const overview=`<div class="metrics"><div class="reading"><span>Whole-machine CPU</span><strong>73%</strong><small>Independent of process filter</small></div><div class="reading"><span>RAM used</span><strong>75%</strong><small>12 / 16 GiB usable · 4 GiB available</small></div><div class="reading"><span>GPU · busiest engine</span><strong>47%</strong><small>Not total GPU utilization</small></div><div class="reading"><span>OS-reported uptime</span><strong>1d 6h 24m</strong><small>Since boot</small></div></div>`;
const storage=`<div><p class="network-title">C:\\ <span class="kind">Fixed · NTFS</span></p><dl class="facts">${fact('Caller-visible capacity (quota-aware)','900 GiB')}${fact('Total free space','300 GiB')}${fact('Available to current caller','200 GiB')}</dl><p class="hint">Capacity may be quota-limited; not a physical-volume capacity claim.</p></div>`;
const sensors=`<div><div class="unavailable"><b>CPU &amp; GPU temperature</b><span>Unavailable</span></div><p class="hint">Provider not verified · no temperature inferred.</p></div>`;
const network=`<div><p class="network-title">Example Ethernet <span class="kind">Physical</span></p><dl class="facts">${fact('Receive / send traffic','1.2 MiB/s / 84 KiB/s')}${fact('Receive / send link speed','1 Gbit/s / 1 Gbit/s')}${fact('Local IPv4 / IPv6','192.0.2.7 / 2001:db8::7')}${fact('Gateway · DNS','192.0.2.1 · 192.0.2.53')}</dl><p class="hint">Per adapter; traffic is not summed. Link speed is not traffic rate.</p></div>`;
const hardware=`<dl class="facts">${fact('CPU','Example 8-core CPU')}${fact('Cores / logical processors','8 / 16')}${fact('Installed RAM','16 GiB')}${fact('GPU','Example discrete GPU')}${fact('Dedicated VRAM','8 GiB · excludes shared RAM')}${fact('Motherboard / BIOS','Example Board / Firmware 1.0')}${fact('Windows-reported version','Windows 11 · build 26100')}</dl>`;
const section=(id,name,content,extra='')=>`<section class="section ${name.toLowerCase()} ${extra}" id="${id}-${name.toLowerCase()}"><h3>${name}</h3>${content}</section>`;
const metadata=`<details class="meta"><summary>Sampling &amp; availability details</summary><p>Fictional sample at 10:42:18. Live 10:42:18 · Storage 10:42:10 · Hardware 10:42:00. Native cache cadences: 2 s / 15 s / 60 s. Example sources: Windows CPU/memory APIs, GPU busiest-engine counters, adapter counters and storage metadata. Overall partial: temperatures unavailable because provider is not verified. No hardware identifiers shown.</p></details>`;
function body(id){
 const o=section(id,'Overview',overview,id==='A'?'strip':id==='E'?'hero':'');
 const s=section(id,'Storage',storage),t=section(id,'Sensors',sensors),n=section(id,'Network',network),h=section(id,'Hardware',hardware);
 if(id==='B')return `<div class="split"><div>${o}${n}${t}</div><div>${s}${h}</div></div>${metadata}`;
 if(id==='C')return `<div class="browse"><nav class="section-nav" aria-label="Option C sections">${['Overview','Storage','Sensors','Network','Hardware'].map(x=>`<a href="#C-${x.toLowerCase()}">${x}</a>`).join('')}</nav><div>${o}${s}${t}${n}${h}${metadata}</div></div>`;
 if(id==='E')return `<div class="hero-rail"><div>${o}${s}${n}${t}</div><aside class="hardware-rail">${h}</aside></div>${metadata}`;
 return o+s+t+n+h+metadata;
}
const choiceContainer=document.querySelector('.choices'),previewContainer=document.querySelector('.previews');
for(const d of designs){
 const button=document.createElement('button');button.type='button';button.className='choice';button.dataset.design=d.id;button.setAttribute('aria-controls',`preview-${d.id}`);button.innerHTML=`<span class="letter">OPTION ${d.id}</span><div class="layout-mark mark-${d.id.toLowerCase()}" aria-hidden="true">${d.mark}</div><b>${d.name}</b><small>${d.summary}</small>`;choiceContainer.append(button);
 const preview=document.createElement('article');preview.className='preview';preview.id=`preview-${d.id}`;preview.setAttribute('aria-label',`Option ${d.id}: ${d.name}`);preview.innerHTML=`<div class="preview-label"><h2>${d.id} · ${d.name}</h2><p>${d.description}</p></div><div class="shell ${d.id.toLowerCase()}"><header class="chrome"><strong>Process Manager</strong><span class="close" aria-hidden="true">×</span></header><div class="tabs" aria-label="Preview: System Info selected"><span>Processes</span><span class="active">System Info</span></div><div class="stage" tabindex="0" aria-label="Scrollable ${d.name} preview"><div class="intro"><p class="fiction">FICTIONAL SAMPLE</p><p>10:42:18 · whole machine · partial availability</p></div>${body(d.id)}</div></div>`;previewContainer.append(preview);
}
let selected='A',all=false;
const answer=window.openchamber?.answer;const restored=answer?.design??answer?.data?.design;if(designs.some(d=>d.id===restored))selected=restored;
function update(){
 document.querySelectorAll('.choice').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.design===selected)));
 document.querySelectorAll('.preview').forEach(p=>p.hidden=!all&&p.id!==`preview-${selected}`);
 previewContainer.classList.toggle('all',all);document.querySelector('.toggle').setAttribute('aria-pressed',String(all));document.querySelector('.toggle').textContent=all?'Show selected only':'Show all five';
 document.querySelector('#selection').textContent=`Selected ${selected} · ${designs.find(d=>d.id===selected).name}`;
}
choiceContainer.addEventListener('click',e=>{const b=e.target.closest('button[data-design]');if(b){selected=b.dataset.design;update();}});
document.querySelector('.toggle').addEventListener('click',()=>{all=!all;update();});
document.querySelector('.submit').addEventListener('click',async e=>{const button=e.currentTarget;const label=`Selected ${selected} · ${designs.find(d=>d.id===selected).name}`;if(window.openchamber?.submit){try{await window.openchamber.submit({design:selected},label);button.disabled=true;button.textContent='Selection sent';}catch{document.querySelector('#selection').textContent=label+' · could not send; try again';}}else{document.querySelector('#selection').textContent=label+' · saved in this preview only';}});
update();
})();
</script>
</body>
</html>

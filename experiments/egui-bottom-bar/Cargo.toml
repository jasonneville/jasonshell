[package]
name = "egui-bottom-bar"
version = "0.1.0"
edition = "2024"
publish = false
description = "Isolated simulated bottom-bar fixture; no shell services"

[dependencies]
egui = { version = "=0.32.3", features = ["accesskit"] }
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "x11", "wayland"] }

# eframe's wgpu feature alone does not enable a GPU backend when defaults are off.
# Unify the pinned production renderer with Direct3D 12 on the Windows target.
[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=25.0.2", default-features = false, features = ["dx12"] }

[workspace]

[dev-dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[lints.rust]
unsafe_code = "forbid"

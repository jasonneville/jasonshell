<!doctype html>
<html data-theme="base-dark"><head><meta charset="utf-8"><title>Bottom bar production CSS acceptance</title>
<link rel="stylesheet" href="/src/app.css"><link rel="stylesheet" href="/src/components/BottomBar.css">
</head><body><div id="host" style="height:32.4px;width:960px">
<!-- Test-owned static markup mirrors BottomBar.svelte. No IPC; no layout/style overrides on production elements. -->
<div class="surface bottom-bar" style="--bottom-bar-height-logical:32.4px;--preview-connector-left:0px;--preview-connector-width:0px;--preview-connector-color:transparent">
<section class="taskbar-strip" aria-label="Taskbar"><div class="launcher-strip" aria-label="Pinned Explorer taskbar apps"><button class="quick-launch-button" aria-label="Quick Launch">Quick Launch</button></div>
<div class="task-strip" role="toolbar" aria-label="Open windows" tabindex="-1">
<div class="task-group task-group-direct task-group-active" style="--task-window-count:2;--task-direct-count:2" role="group" aria-label="Editor, 2 windows"><button class="task-button task-button-active" id="source"><img class="task-icon" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%236a9ddd'/%3E%3C/svg%3E" alt="" draggable="false"><span class="task-label">Active editor with a very long document title that must truncate without widening its group</span></button><button class="task-button task-button-minimized" disabled><img class="task-icon" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%236a9ddd'/%3E%3C/svg%3E" alt="" draggable="false"><span class="task-label">Minimized disabled</span></button></div>
<div class="task-group task-group-capsule task-group-toasted task-group-busy" style="--task-window-count:3" role="group" aria-label="Browser, 3 windows"><button class="task-button task-capsule" aria-haspopup="dialog"><img class="task-icon" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%236a9ddd'/%3E%3C/svg%3E" alt="" draggable="false"><span class="task-label">Browser</span><span class="task-count" aria-label="3 windows">3</span></button></div>
<div class="task-group task-group-direct task-group-minimized task-group-drop-target" style="--task-window-count:1;--task-direct-count:1" role="group" aria-label="Other"><button class="task-button task-window-attention"><img class="task-icon" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%236a9ddd'/%3E%3C/svg%3E" alt="" draggable="false"><span class="task-label">Attention</span></button></div>
<div class="taskbar-overflow-status" role="status">Use arrow keys</div></div></section>
<button class="process-manager-button" aria-label="Open process manager">P</button></div></div>
<script type="module" src="./checks.js"></script></body></html>
